name: apexhunt_ai
description: "ApexHunt AI — honest AI CV tailoring, job discovery and interview prep."
publish_to: 'none'

# versionName+versionCode. Bump the number after + for every Play Console upload.
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  dio: 5.11.1
  flutter_secure_storage: 11.2.0
  path_provider: 2.1.6
  file_picker: 13.2.0
  pdfrx: 2.10.1
  pdf: 3.13.1
  archive: 4.5.2
  xml: 7.1.0
  share_plus: 13.3.1
  url_launcher: 6.3.3
  purchases_flutter: 10.18.1
  supabase_flutter: 2.18.3
  uuid: 4.6.0
  intl: 0.20.3
  flutter_tts: 4.2.5
  package_info_plus: 10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Italic.ttf
          style: italic
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 24
