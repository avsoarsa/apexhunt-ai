name: Gateway tests
on:
  push:
    paths: ['apexhunt/gateway/**']
  pull_request:
    paths: ['apexhunt/gateway/**']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: apex_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apexhunt/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: psql postgresql://postgres:pg@localhost/apex_test -v ON_ERROR_STOP=1 -f schema.sql
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:pg@localhost/apex_test
