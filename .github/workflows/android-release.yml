# Builds a signed Play Store bundle (.aab) in the cloud — no local Flutter install needed.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   UPLOAD_KEYSTORE_BASE64   base64 of signing/apexhunt-upload.jks   (base64 -i apexhunt-upload.jks | pbcopy)
#   KEY_PROPERTIES           full contents of signing/key.properties
#   APP_ENV_JSON             contents of apexhunt/app/env/prod.json (gateway, Supabase, RevenueCat keys)
# Optional:
#   PLAY_SERVICE_ACCOUNT_JSON  Play Console service account → auto-upload to the internal testing track
name: Android release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    defaults:
      run:
        working-directory: apexhunt/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Write signing + env files
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
          APP_ENV_JSON: ${{ secrets.APP_ENV_JSON }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf '%s\n' "$KEY_PROPERTIES" | sed 's#^storeFile=.*#storeFile=upload-keystore.jks#' > android/key.properties
          mkdir -p env && printf '%s' "$APP_ENV_JSON" > env/prod.json
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build app bundle
        run: flutter build appbundle --release --dart-define-from-file=env/prod.json --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: apexhunt-aab-${{ github.run_number }}
          path: apexhunt/app/build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Play internal testing
        if: env.HAS_PLAY_JSON == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.apexhunt.ai
          releaseFiles: apexhunt/app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
